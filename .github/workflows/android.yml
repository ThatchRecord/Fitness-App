name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          inject_permission() {
            local perm=$1
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "s/<application/<uses-permission android:name=\"$perm\" \/>\n    <application/" "$MANIFEST"
              echo "Permiso inyectado: $perm"
            fi
          }

          # Permisos base y de batería
          inject_permission "android.permission.VIBRATE"
          inject_permission "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
          
          # Alarma exacta (Play Protect es más permisivo con SCHEDULE_EXACT_ALARM)
          inject_permission "android.permission.SCHEDULE_EXACT_ALARM"
          
          # Permisos para el Servicio en Primer Plano (Prioridad de ejecución)
          inject_permission "android.permission.FOREGROUND_SERVICE"
          inject_permission "android.permission.FOREGROUND_SERVICE_SPECIAL_USE"
          inject_permission "android.permission.WAKE_LOCK"
          inject_permission "android.permission.POST_NOTIFICATIONS"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30